[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openviking-lite"
version = "0.3.0"
description = "Local, text-only OpenViking core with CPU embeddings and one chat API"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "fastembed>=0.7,<0.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/zza1211/openviking-lite"
Issues = "https://github.com/zza1211/openviking-lite/issues"

[project.scripts]
ov-lite = "openviking_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openviking_lite = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
